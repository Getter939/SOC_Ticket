<button
    type="button"
    class="theme-switch"
    id="theme-toggle"
    role="switch"
    aria-checked="false"
    aria-label="Switch to dark mode"
    title="Switch to dark mode"
>
    <span class="theme-switch__track" aria-hidden="true">
        <span class="theme-switch__thumb">
            <i class="bi bi-sun-fill theme-switch__icon theme-switch__icon--light"></i>
            <i class="bi bi-moon-stars-fill theme-switch__icon theme-switch__icon--dark"></i>
        </span>
    </span>
</button>
