<div class="empty-state" role="status">
  <span class="empty-state__icon" aria-hidden="true"><i class="bi {{ icon|default:'bi-inbox' }}"></i></span>
  <div class="empty-state__title">{{ title }}</div>
  {% if description %}<p class="empty-state__description">{{ description }}</p>{% endif %}
  {% if action_url and action_label %}
  <a class="btn btn-sm btn-outline-primary mt-3" href="{{ action_url }}">
    {% if action_icon %}<i class="bi {{ action_icon }} me-1" aria-hidden="true"></i>{% endif %}{{ action_label }}
  </a>
  {% endif %}
</div>
