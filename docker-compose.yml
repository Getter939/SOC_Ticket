services:

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: ticketdata
      POSTGRES_USER: ticket
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Bound to loopback, NOT 0.0.0.0. "5432:5432" published the database to
      # every interface, putting the Postgres password on the LAN attack
      # surface. pgAdmin on this host still connects via 127.0.0.1:5432.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket -d ticketdata"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: always
    # ⚠ LOCAL DEVELOPMENT ONLY — this overrides the image's production CMD with
    # the Django dev server (auto-reload) and bind-mounts the source tree.
    # Do NOT use this compose file as-is for production: the image's default
    # CMD (gunicorn, DEBUG=False) is the production entrypoint. Keep DEBUG=True
    # in .env for this dev setup.
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8088"
    volumes:
      - .:/app                # live reload: code changes reflect instantly
    ports:
      - "8088:8088"
    env_file:
      - .env
    environment:
      DB_HOST: db             # override .env so it points to the Docker db service
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
