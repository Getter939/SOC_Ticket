# Continuous integration for the SOC Ticket app.
#
# Gates every push to main and every pull request: the same checks a developer
# runs locally, on a clean runner, before code can be tagged for a production
# deploy (see docs/operations/deploy-and-release.windows.md).
#
# Production runs Python 3.14 on Windows Server + native PostgreSQL 18. CI runs
# Python 3.14 on ubuntu-latest with a postgres:18 service container: no
# migration hardcodes the production Thai_Thailand.874 collation (that is a
# database-create concern, handled in runbook Stage 4, not a migration concern),
# so a Linux Postgres reproduces the schema faithfully.
#
# No real secrets are used. config/settings.py reads config via python-decouple;
# the only keys without a safe default are SECRET_KEY and DB_*, so those are the
# only ones supplied here — as throwaway values scoped to this job. OPENSEARCH_*
# is left unset so ingest tests never reach a real Indexer.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: migrations + checks + tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ticketdata_ci
          POSTGRES_USER: ticket_ci
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Throwaway config — not secrets. Mirrors the required (no-default) keys
      # config/settings.py reads via python-decouple.
      SECRET_KEY: ci-dummy-secret-key-not-used-in-production
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: ticketdata_ci
      DB_USER: ticket_ci
      DB_PASSWORD: ci-postgres-password
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_SSLMODE: disable
      # Keep the file log handler out of CI (settings also drops it under `test`).
      LOG_DIR: ${{ runner.temp }}/soc-logs

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check for missing migrations
        # Fails if a model change has no accompanying migration — the class of
        # bug that otherwise only surfaces during `migrate` on the PROD box.
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Django system check
        run: python manage.py check

      - name: Deployment check (informational)
        # `check --deploy` flags W004 (HSTS) and the secure-cookie settings that
        # are intentionally OFF here (no TLS in CI) — those are by-design on the
        # HTTP/proxy PROD bridge, so this is reported but never blocks the build.
        continue-on-error: true
        run: python manage.py check --deploy

      - name: Run the test suite
        run: python manage.py test --verbosity 2
